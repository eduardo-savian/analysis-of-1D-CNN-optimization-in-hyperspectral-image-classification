# Variáveis de execução do trabalho. O pacote src/hsi/ lê este arquivo ao ser importado:
# um valor mudado aqui vale para o notebook, para o terminal e para os experimentos.

[caminhos]
dados = "data/dataHSI"
resultados = "experimentos/resultados"
figuras = "tcc/TCC III - EDUARDO SAVIAN/src/assets/resultados"

[dados]
# Semente do PCA e da divisão dos dados, fixa como no original; a semente de cada
# execução (execucao.seed) só muda o treino: pesos iniciais, ordem dos lotes e dropout.
semente = 42
# Componentes do PCA espectral por cena, como no notebook original.
pca = { IP = 30, PU = 15, SA = 15 }

# Padrões de uma execução (ExperimentConfig, com os mesmos nomes): os hiperparâmetros do
# notebook de Souza (2023) com a CNN do projeto, o teto de épocas e a parada deste trabalho.
[execucao]
dataset = "PU"
segmenter = "seeds"
# "projeto": a CNN do capítulo 3, com max-pooling; "original": a do notebook de Souza (2023).
cnn = "projeto"
# 15% das amostras saem do treino e se dividem ao meio entre teste e validação.
test_ratio = 0.15
valid_ratio = 0.5
# Fração do treino usada de fato; validação e teste não mudam.
train_fraction = 1.0
epochs = 200
batch_size = 32
learning_rate = 1e-3
weight_decay = 0.0
dropout = 0.5
# 1e-7 é o padrão do Keras; o do PyTorch é 1e-8.
adam_eps = 1e-8
# Parada antecipada: `patience` épocas sem a acurácia de validação melhorar `min_delta`.
patience = 10
min_delta = 1e-3
# Meta de acurácia de validação que encerra o treino; sem a chave `target`, desligada.
seed = 42

[segmentadores]
# Os segmentadores previstos no projeto.
lista = ["seeds", "lsc", "watershed"]

# SEEDS: os parâmetros do notebook original.
[segmentadores.seeds.IP]
num_superpixels = 350
num_iterations = 200
prior = 2
num_levels = 10
num_histogram_bins = 5
double_step = true

[segmentadores.seeds.PU]
num_superpixels = 150
num_iterations = 150
prior = 1
num_levels = 8
num_histogram_bins = 15
double_step = true

[segmentadores.seeds.SA]
num_superpixels = 150
num_iterations = 150
prior = 1
num_levels = 8
num_histogram_bins = 15
double_step = true

# LSC e Watershed calibrados para gerar 0,7x, 1x e 1,35x as regiões do SEEDS com os
# parâmetros do original (81 em IP, 45 em PU e 96 em SA; medido em 04/11). Em cada lista,
# o valor do meio é o padrão e a busca de hiperparâmetros usa os três.
[segmentadores.lsc]
num_iterations = 10
ratio = [0.04, 0.075, 0.12]
region_size = { IP = [19, 16, 14], PU = [76, 65, 57], SA = [40, 34, 29] }

[segmentadores.watershed]
markers = { IP = [86, 116, 152], PU = [56, 72, 102], SA = [98, 136, 172] }

[hpo]
# A grade completa teria até 2.187 pontos em Indian Pines. Ela fica com o segmentador e
# os dois eixos de maior efeito na validação nas buscas anteriores (dropout, 18 pp, e
# taxa de aprendizado, 15 pp): 3 x 3 x 3 = 27 trials.
eixos_da_grade = ["learning_rate", "dropout"]
# Componentes do PCA: estes fatores sobre o valor da cena, sem descer do mínimo da CNN.
fatores_pca = [0.5, 1.0, 1.5]
# Trials sorteados antes de o processo gaussiano começar a escolher (no mínimo um por
# segmentador); o padrão do Optuna seria 10.
bayes_trials_iniciais = 4

# Cada eixo inclui o valor da configuração original (taxa 1e-3, dropout 0,5, wd 0, lote 32).
[hpo.espaco]
learning_rate = [3e-4, 1e-3, 3e-3]
dropout = [0.2, 0.35, 0.5]
weight_decay = [0.0, 1e-5, 1e-4]
batch_size = [32, 64, 128]

# Variações do SEEDS em torno do padrão da cena. O número de regiões dele anda em
# degraus (em IP, 16, 81 ou 324), então elas mexem também nas iterações e no prior.
[hpo.seeds]
fator_superpixels = [0.7, 1.35]
num_iterations = [120, 250]
prior = [1, 3]
minimo_superpixels = 40

# ---------------------------------------------------------------- experimentos

[experimentos.01]
cenas = ["IP", "PU", "SA"]

[experimentos.02]
cenas = ["IP", "PU", "SA"]
sementes = [11, 29, 42, 73, 101]

[experimentos.03]
cenas = ["IP", "PU", "SA"]
trials = 16
sementes = [11, 29, 42, 73, 101]

[experimentos.04]
cenas = ["IP"]
# O tamanho da grade, para as duas estratégias terem o mesmo orçamento.
trials = 27
orcamentos_de_epocas = [10, 40, 200]
sementes = [11, 29, 42]
train_fraction = 0.10
target = 0.95

[experimentos.05]
cenas = ["IP"]
sementes = [11, 29, 42, 73, 101]

[experimentos.06]
cenas = ["IP"]
particoes = [2, 4, 8, 16]
sementes = [11, 29, 42]
epochs = 25
batch_size = 64

[experimentos.07]
cenas = ["IP"]
particoes = [2, 4, 8, 16, 32]
repeticoes = { frio = 2, quente = 3 }
epochs = 25
batch_size = 64
# Memória proporcional (PSS) de um worker de processo, medida: 481 MB. Um pool que não
# cabe com 25% de folga é recusado, para a medição não cronometrar a área de troca.
mb_por_processo = 481

[experimentos.08]
cenas = ["IP", "PU", "SA"]
threads = [1, 2, 4, 8, 16]
blocos = [1, 64, 1024]
repeticoes = 5
# Com bloco 1 é uma tarefa por pixel: só nestas cenas e com menos repetições. Em Pavia e
# Salinas seriam 43 e 54 mil tarefas por execução.
cenas_bloco_1 = ["IP"]
repeticoes_bloco_1 = 3
# Threads do PyTorch no treino do modelo e na inferência em lote de referência.
threads_treino = 16
threads_lote = [1, 16]
# (n, bloco, seção) da execução cuja linha do tempo é gravada inteira, uma por arranjo.
linha_do_tempo = [4, 64, "minima"]
